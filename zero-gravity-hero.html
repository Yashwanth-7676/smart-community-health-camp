<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE NEW WEB — Zero Gravity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #040008; font-family: 'Space Grotesk', sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #app { position: relative; width: 100vw; height: 100vh; }

    /* ── UI Overlay ────────────────────────────── */
    #overlay {
      position: absolute; inset: 0;
      pointer-events: none; z-index: 20;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      gap: 0;
    }
    .eyebrow {
      font-size: clamp(0.6rem, 1.5vw, 0.8rem);
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #a78bfa;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
    }
    .headline-line {
      display: block;
      font-size: clamp(3.5rem, 12vw, 10rem);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.04em;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255,255,255,0.85);
      text-stroke: 1.5px rgba(255,255,255,0.85);
      background: linear-gradient(135deg, #fff 0%, #a78bfa 50%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0;
      transform: translateY(40px) skewX(-2deg);
    }
    .hl1 { animation: fadeUp 1.0s cubic-bezier(0.16,1,0.3,1) 0.5s forwards; }
    .hl2 { animation: fadeUp 1.0s cubic-bezier(0.16,1,0.3,1) 0.72s forwards; }
    .hl3 { animation: fadeUp 1.0s cubic-bezier(0.16,1,0.3,1) 0.94s forwards; }

    .subline {
      margin-top: 2rem;
      font-size: clamp(0.75rem, 1.8vw, 1rem);
      font-weight: 300;
      letter-spacing: 0.06em;
      color: rgba(167,139,250,0.75);
      max-width: 42ch;
      text-align: center;
      line-height: 1.6;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1.0s cubic-bezier(0.16,1,0.3,1) 1.1s forwards;
    }
    .cta-row {
      display: flex;
      gap: 16px;
      margin-top: 2.5rem;
      pointer-events: auto;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1.0s cubic-bezier(0.16,1,0.3,1) 1.3s forwards;
    }
    .btn-primary {
      padding: 0.85em 2.2em;
      border-radius: 999px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #fff;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 32px rgba(124,58,237,0.5);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary:hover { transform: scale(1.06); box-shadow: 0 0 48px rgba(124,58,237,0.75); }
    .btn-ghost {
      padding: 0.85em 2.2em;
      border-radius: 999px;
      background: transparent;
      color: rgba(255,255,255,0.7);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.2);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-ghost:hover { border-color: #a78bfa; color: #a78bfa; }

    /* Status bar */
    .status-bar {
      position: absolute;
      bottom: 32px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 36px;
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(167,139,250,0.35);
      pointer-events: none;
      opacity: 0;
      animation: fadeUp 0.8s ease 1.6s forwards;
    }
    .pulse-dot {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #a78bfa;
      margin-right: 6px;
      vertical-align: middle;
      animation: pulse 2s infinite;
    }

    /* Click hint */
    #clickHint {
      position: absolute;
      top: 28px; right: 32px;
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(56,189,248,0.4);
      pointer-events: none;
      opacity: 0;
      animation: fadeUp 0.8s ease 1.8s forwards;
    }

    /* Cursor magnetic orb */
    #cursor {
      position: fixed;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle, #a78bfa, #7c3aed);
      pointer-events: none;
      z-index: 100;
      mix-blend-mode: screen;
      transform: translate(-50%,-50%);
      box-shadow: 0 0 18px 4px rgba(167,139,250,0.7);
      transition: width 0.2s, height 0.2s, box-shadow 0.2s;
    }
    #cursor.active {
      width: 28px; height: 28px;
      box-shadow: 0 0 40px 12px rgba(167,139,250,0.8), 0 0 0 1px #a78bfa;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0) skewX(0deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<div id="app">
  <div id="canvas-container"></div>

  <!-- UI Overlay -->
  <div id="overlay">
    <p class="eyebrow">Awwwards · Zero Gravity Simulation</p>
    <div style="display:flex;flex-direction:column;align-items:center">
      <span class="headline-line hl1">THE</span>
      <span class="headline-line hl2">NEW</span>
      <span class="headline-line hl3">WEB</span>
    </div>
    <p class="subline">An immersive physics-driven experience at the intersection of art and engineering.</p>
    <div class="cta-row">
      <button class="btn-primary" id="explodeBtn">Detonate</button>
      <button class="btn-ghost">Explore work</button>
    </div>

    <div class="status-bar">
      <span><span class="pulse-dot"></span>Live Physics</span>
      <span>25 Bodies</span>
      <span>WebGL 2.0</span>
      <span>60 FPS</span>
    </div>
  </div>

  <div id="clickHint">Click canvas to detonate · Hover to glow</div>

  <!-- Custom cursor -->
  <div id="cursor"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment }  from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass }       from 'three/addons/postprocessing/ShaderPass.js';
import { BokehPass }        from 'three/addons/postprocessing/BokehPass.js';
import { FilmPass }         from 'three/addons/postprocessing/FilmPass.js';
import { VignetteShader }   from 'three/addons/shaders/VignetteShader.js';

// ═══════════════════════════════════════════════
// 1. Core Renderer Setup
// ═══════════════════════════════════════════════
const container = document.getElementById('canvas-container');
const W = window.innerWidth, H = window.innerHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, W/H, 0.1, 200);
camera.position.set(0, 0, 14);

// ═══════════════════════════════════════════════
// 2. Nebula Shader Background
// ═══════════════════════════════════════════════
const nebulaVert = `
varying vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = vec4(position, 1.0);
}`;

const nebulaFrag = `
uniform float uTime;
uniform vec2  uRes;
varying vec2  vUv;

float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }

float noise(vec2 p){
  vec2 i=floor(p); vec2 f=fract(p);
  vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash(i+vec2(0,0)),hash(i+vec2(1,0)),u.x),
             mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);
}

float fbm(vec2 p){
  float v=0.0, a=0.5;
  for(int i=0;i<6;i++){ v+=a*noise(p); p*=2.1; a*=0.5; }
  return v;
}

void main(){
  vec2 uv = vUv;
  float t = uTime * 0.08;

  float n1 = fbm(uv * 2.4 + vec2(t * 0.6, t * 0.3));
  float n2 = fbm(uv * 3.8 - vec2(t * 0.2, t * 0.7));
  float n  = n1 * 0.6 + n2 * 0.4;

  // Deep dark background color
  vec3 base  = vec3(0.012, 0.0, 0.028);  // near black purple
  vec3 purple = vec3(0.28, 0.08, 0.55);  // deep violet
  vec3 blue   = vec3(0.04, 0.15, 0.62);  // neon blue

  vec3 col = base;
  col = mix(col, purple, smoothstep(0.35, 0.62, n) * 0.55);
  col = mix(col, blue,   smoothstep(0.50, 0.75, n2) * 0.40);

  // Subtle radial center glow
  float dist = length(uv - 0.5);
  col += vec3(0.06, 0.02, 0.16) * (1.0 - smoothstep(0.0, 0.65, dist));

  gl_FragColor = vec4(col, 1.0);
}`;

const bgMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2),
  new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uRes: { value: new THREE.Vector2(W, H) } },
    vertexShader: nebulaVert,
    fragmentShader: nebulaFrag,
    depthTest: false, depthWrite: false
  })
);
bgMesh.renderOrder = -1;
const bgScene  = new THREE.Scene();
const bgCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
bgScene.add(bgMesh);

// ═══════════════════════════════════════════════
// 3. Lighting
// ═══════════════════════════════════════════════
scene.add(new THREE.AmbientLight(0x150025, 2.0));

const pLightPurple = new THREE.PointLight(0x7c3aed, 120, 40);
pLightPurple.position.set(-8, 6, 4);
scene.add(pLightPurple);

const pLightCyan = new THREE.PointLight(0x38bdf8, 100, 40);
pLightCyan.position.set(8, -5, 4);
scene.add(pLightCyan);

const pLightPink = new THREE.PointLight(0xf472b6, 60, 30);
pLightPink.position.set(0, 8, -6);
scene.add(pLightPink);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(5, 10, 8);
scene.add(dirLight);

// HDR-like env
const pmrem = new THREE.PMREMGenerator(renderer);
const env = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = env;

// ═══════════════════════════════════════════════
// 4. Glass / Iridescent Materials
// ═══════════════════════════════════════════════
function makeMaterial(hue) {
  const color = new THREE.Color().setHSL(hue, 0.7, 0.5);
  return new THREE.MeshPhysicalMaterial({
    color,
    roughness:            0.06,
    metalness:            0.0,
    transmission:         0.92,
    thickness:            2.0,
    ior:                  1.65,
    clearcoat:            1.0,
    clearcoatRoughness:   0.05,
    specularIntensity:    1.0,
    specularColor:        new THREE.Color(0xffffff),
    envMapIntensity:      3.0,
    transparent:          true,
    opacity:              0.9,
    side:                 THREE.DoubleSide,
  });
}

// Glow emissive material for on-hover
function makeGlowMaterial(hue) {
  const m = makeMaterial(hue);
  m.emissive    = new THREE.Color().setHSL(hue, 1.0, 0.5);
  m.emissiveIntensity = 0;
  return m;
}

// ═══════════════════════════════════════════════
// 5. Geometry Library (25 Objects)
// ═══════════════════════════════════════════════
const geometries = [
  new THREE.TorusKnotGeometry(0.8, 0.28, 128, 20, 2, 3),
  new THREE.TorusKnotGeometry(0.9, 0.22, 128, 16, 3, 5),
  new THREE.TorusKnotGeometry(0.75, 0.30, 128, 20, 2, 5),
  new THREE.IcosahedronGeometry(1.0, 0),
  new THREE.IcosahedronGeometry(0.8, 1),
  new THREE.IcosahedronGeometry(1.1, 0),
  new THREE.OctahedronGeometry(1.0, 0),
  new THREE.OctahedronGeometry(0.85, 1),
  new THREE.TetrahedronGeometry(1.0, 0),
  new THREE.TetrahedronGeometry(1.2, 1),
  new THREE.DodecahedronGeometry(0.9, 0),
  new THREE.DodecahedronGeometry(0.75, 1),
  new THREE.TorusGeometry(0.9, 0.28, 32, 64),
  new THREE.TorusGeometry(0.75, 0.35, 24, 48),
  new THREE.TorusGeometry(1.1, 0.18, 48, 80),
  new THREE.SphereGeometry(0.85, 64, 64),
  new THREE.SphereGeometry(0.7, 32, 32),
  new THREE.ConeGeometry(0.7, 1.6, 6),
  new THREE.ConeGeometry(0.55, 1.2, 5),
  new THREE.CylinderGeometry(0.5, 0.5, 1.4, 7),
  // Custom extruded star
  (() => {
    const sh = new THREE.Shape();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 === 0 ? 1.0 : 0.42;
      const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
      i === 0 ? sh.moveTo(Math.cos(a)*r, Math.sin(a)*r) : sh.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    sh.closePath();
    return new THREE.ExtrudeGeometry(sh, { depth: 0.35, bevelEnabled: true, bevelSize: 0.08, bevelSegments: 4 });
  })(),
  // Custom extruded heart
  (() => {
    const sh = new THREE.Shape();
    sh.moveTo(0, 0); sh.bezierCurveTo(0, -0.3, -0.5, -0.5, -1, 0);
    sh.bezierCurveTo(-1.5, 0.5, -1.5, 1.2, 0, 1.8);
    sh.bezierCurveTo(1.5, 1.2, 1.5, 0.5, 1, 0);
    sh.bezierCurveTo(0.5, -0.5, 0, -0.3, 0, 0);
    return new THREE.ExtrudeGeometry(sh, { depth: 0.3, bevelEnabled: true, bevelSize: 0.06, bevelSegments: 3, scale: 0.55 });
  })(),
  new THREE.BoxGeometry(1.0, 1.0, 1.0, 3, 3, 3),
  new THREE.CapsuleGeometry(0.35, 0.9, 12, 32),
  new THREE.RingGeometry(0.5, 1.0, 48, 4),
];

const TOTAL = 25;
const objects = [];
const velocities  = [];
const rotSpeeds   = [];
const homePositions = [];

for (let i = 0; i < TOTAL; i++) {
  const geo = geometries[i % geometries.length];
  const hue = (i / TOTAL) * 1.0;
  const mat = makeGlowMaterial(hue);

  // Center geometry
  geo.computeBoundingBox();
  const center = new THREE.Vector3();
  geo.boundingBox.getCenter(center);
  geo.translate(-center.x, -center.y, -center.z);

  const mesh = new THREE.Mesh(geo, mat);
  const scale = 0.55 + Math.random() * 0.5;
  mesh.scale.setScalar(scale);

  const pos = new THREE.Vector3(
    (Math.random() - 0.5) * 13,
    (Math.random() - 0.5) * 7.5,
    (Math.random() - 0.5) * 6
  );
  mesh.position.copy(pos);
  mesh.rotation.set(Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2);

  scene.add(mesh);
  objects.push(mesh);
  homePositions.push(pos.clone());
  velocities.push(new THREE.Vector3(
    (Math.random() - 0.5) * 0.01,
    (Math.random() - 0.5) * 0.01,
    (Math.random() - 0.5) * 0.01
  ));
  rotSpeeds.push(new THREE.Vector3(
    (Math.random() - 0.5) * 0.008,
    (Math.random() - 0.5) * 0.012,
    (Math.random() - 0.5) * 0.008
  ));
}

// ═══════════════════════════════════════════════
// 6. Magnetic Cursor Particles
// ═══════════════════════════════════════════════
const PARTICLE_COUNT = 60;
const particleGeo = new THREE.BufferGeometry();
const pPositions  = new Float32Array(PARTICLE_COUNT * 3);
const pColors     = new Float32Array(PARTICLE_COUNT * 3);
const particleData = [];

for (let i = 0; i < PARTICLE_COUNT; i++) {
  pPositions[i*3]   = (Math.random()-0.5)*16;
  pPositions[i*3+1] = (Math.random()-0.5)*10;
  pPositions[i*3+2] = (Math.random()-0.5)*4;
  const c = new THREE.Color().setHSL((i/PARTICLE_COUNT)*0.7 + 0.6, 1, 0.65);
  pColors[i*3] = c.r; pColors[i*3+1] = c.g; pColors[i*3+2] = c.b;
  particleData.push({
    vel: new THREE.Vector3((Math.random()-0.5)*0.02, (Math.random()-0.5)*0.02, 0),
    angle: Math.random() * Math.PI * 2,
    radius: 1.5 + Math.random() * 2.5
  });
}

particleGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
particleGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

const particleMat = new THREE.PointsMaterial({
  size: 0.065,
  vertexColors: true,
  transparent: true,
  opacity: 0.8,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// ═══════════════════════════════════════════════
// 7. Post Processing
// ═══════════════════════════════════════════════
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

// Bloom
const bloom = new UnrealBloomPass(
  new THREE.Vector2(W, H),
  1.45,   // intensity/strength
  0.55,   // radius
  0.22    // threshold (low = more things glow)
);
composer.addPass(bloom);

// Depth of field (Bokeh)
const bokeh = new BokehPass(scene, camera, {
  focus:    10.0,
  aperture: 0.0008,
  maxblur:  0.008
});
composer.addPass(bokeh);

// Film grain + scanlines
const film = new FilmPass(0.28, false);
composer.addPass(film);

// Vignette
const vignettePass = new ShaderPass(VignetteShader);
vignettePass.uniforms['offset'].value = 0.92;
vignettePass.uniforms['darkness'].value = 1.65;
composer.addPass(vignettePass);

// ═══════════════════════════════════════════════
// 8. Mouse / Raycaster / Interaction
// ═══════════════════════════════════════════════
const mouse   = { x: 0, y: 0, ndcX: 0, ndcY: 0 };
const mouse3D = new THREE.Vector3();
const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 0.1;

const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
let hoveredObj   = null;
let hoveredGlow  = 0;
let exploding    = false;
const cursorEl   = document.getElementById('cursor');

window.addEventListener('mousemove', e => {
  mouse.x    = e.clientX;
  mouse.y    = e.clientY;
  mouse.ndcX = (e.clientX / window.innerWidth)  * 2 - 1;
  mouse.ndcY = -(e.clientY / window.innerHeight) * 2 + 1;

  // Project to world plane
  raycaster.setFromCamera({ x: mouse.ndcX, y: mouse.ndcY }, camera);
  raycaster.ray.intersectPlane(plane, mouse3D);

  cursorEl.style.left = e.clientX + 'px';
  cursorEl.style.top  = e.clientY + 'px';
});

// Explosion on click
function doExplosion() {
  if (exploding) return;
  exploding = true;
  objects.forEach((obj) => {
    const dir = new THREE.Vector3().subVectors(obj.position, new THREE.Vector3(0, 0, 0)).normalize();
    const strength = 0.08 + Math.random() * 0.12;
    velocities[objects.indexOf(obj)].add(dir.multiplyScalar(strength));
  });
  setTimeout(() => { exploding = false; }, 800);
}

document.getElementById('canvas-container').addEventListener('click', doExplosion);
document.getElementById('explodeBtn').addEventListener('click', doExplosion);

// ═══════════════════════════════════════════════
// 9. Animation Loop
// ═══════════════════════════════════════════════
const clock = new THREE.Clock();
const camTarget = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  bgMesh.material.uniforms.uTime.value = t;

  // Camera parallax
  camTarget.x = mouse.ndcX * 1.2;
  camTarget.y = mouse.ndcY * 0.8;
  camera.position.x = THREE.MathUtils.lerp(camera.position.x, camTarget.x, 0.03);
  camera.position.y = THREE.MathUtils.lerp(camera.position.y, camTarget.y, 0.03);
  camera.lookAt(0, 0, 0);

  // Raycasting for hover glow
  raycaster.setFromCamera({ x: mouse.ndcX, y: mouse.ndcY }, camera);
  const hits = raycaster.intersectObjects(objects);

  if (hoveredObj) {
    hoveredObj.material.emissiveIntensity = THREE.MathUtils.lerp(
      hoveredObj.material.emissiveIntensity, 0, 0.12
    );
  }
  hoveredObj = hits.length > 0 ? hits[0].object : null;
  cursorEl.classList.toggle('active', hits.length > 0);

  // Physics simulation for each object
  const BOUNDS_X = 9, BOUNDS_Y = 5.8, BOUNDS_Z = 4;
  const CENTER = new THREE.Vector3();

  for (let i = 0; i < TOTAL; i++) {
    const mesh = objects[i];
    const vel  = velocities[i];
    const rot  = rotSpeeds[i];
    const home = homePositions[i];

    // Continuous slow rotation
    let spinMult = 1.0;
    if (mesh === hoveredObj) {
      spinMult = 6.5;
      mesh.material.emissiveIntensity = Math.min(mesh.material.emissiveIntensity + 0.15, 3.5);
    }
    mesh.rotation.x += rot.x * spinMult;
    mesh.rotation.y += rot.y * spinMult;
    mesh.rotation.z += rot.z * spinMult;

    // Apply velocity
    mesh.position.add(vel);

    // Damping
    vel.multiplyScalar(0.988);

    // Gentle drift back to home
    if (!exploding) {
      const toHome = new THREE.Vector3().subVectors(home, mesh.position);
      vel.addScaledVector(toHome, 0.0006);
    }

    // Keep gentle minimum drift
    if (vel.length() < 0.003) {
      vel.add(new THREE.Vector3(
        (Math.random()-0.5)*0.002,
        (Math.random()-0.5)*0.002,
        (Math.random()-0.5)*0.002
      ));
    }

    // Mouse repulsion
    const toMouse = new THREE.Vector3().subVectors(mesh.position, mouse3D);
    const distM = toMouse.length();
    if (distM < 3.5) {
      const force = (1 - distM / 3.5) * 0.022;
      vel.addScaledVector(toMouse.normalize(), force);
    }

    // Soft boundary bounce
    if (Math.abs(mesh.position.x) > BOUNDS_X) {
      vel.x *= -0.65; mesh.position.x = Math.sign(mesh.position.x) * BOUNDS_X;
    }
    if (Math.abs(mesh.position.y) > BOUNDS_Y) {
      vel.y *= -0.65; mesh.position.y = Math.sign(mesh.position.y) * BOUNDS_Y;
    }
    if (Math.abs(mesh.position.z) > BOUNDS_Z) {
      vel.z *= -0.65; mesh.position.z = Math.sign(mesh.position.z) * BOUNDS_Z;
    }

    // Sphere collision
    for (let j = i+1; j < TOTAL; j++) {
      const other = objects[j];
      const diff = new THREE.Vector3().subVectors(mesh.position, other.position);
      const dist = diff.length();
      const minD = 1.6;
      if (dist < minD && dist > 0.001) {
        const n = diff.normalize();
        const overlap = (minD - dist) * 0.5;
        mesh.position.addScaledVector(n, overlap);
        other.position.addScaledVector(n, -overlap);
        const rv = new THREE.Vector3().subVectors(vel, velocities[j]);
        const imp = rv.dot(n) * 0.8;
        if (imp < 0) {
          const iv = n.clone().multiplyScalar(imp);
          vel.sub(iv);
          velocities[j].add(iv);
        }
      }
    }
  }

  // Magnetic cursor particles
  const pos = particleGeo.attributes.position.array;
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const pd = particleData[i];
    pd.angle += 0.012 + i * 0.0002;
    const orbitR = pd.radius;

    // Attract toward mouse3D with orbit
    const tx = mouse3D.x + Math.cos(pd.angle) * orbitR * 0.18;
    const ty = mouse3D.y + Math.sin(pd.angle) * orbitR * 0.18;

    const cx = pos[i*3],  cy = pos[i*3+1];
    const dx = tx - cx,   dy = ty - cy;

    pd.vel.x = pd.vel.x * 0.88 + dx * 0.018;
    pd.vel.y = pd.vel.y * 0.88 + dy * 0.018;

    pos[i*3]   += pd.vel.x;
    pos[i*3+1] += pd.vel.y;
    pos[i*3+2] += (Math.sin(t * 0.4 + i) * 0.005);
  }
  particleGeo.attributes.position.needsUpdate = true;

  // Dynamic lights animation
  pLightPurple.position.x = Math.sin(t * 0.3) * 9;
  pLightPurple.position.y = Math.cos(t * 0.2) * 6;
  pLightCyan.position.x   = Math.cos(t * 0.25) * 9;
  pLightCyan.position.y   = Math.sin(t * 0.35) * 6;

  // Render nebula background first
  renderer.autoClear = false;
  renderer.clear();
  renderer.render(bgScene, bgCamera);
  renderer.autoClear = false;

  // Render scene via post-processing
  composer.render();
}

animate();

// ═══════════════════════════════════════════════
// 10. Responsive Resize
// ═══════════════════════════════════════════════
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.resolution.set(w, h);
  bgMesh.material.uniforms.uRes.value.set(w, h);
});
</script>
</body>
</html>
